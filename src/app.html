<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />

		<!-- Security: CSP is generated by SvelteKit (kit `csp` option in vite.config.ts);
		     HTTP-only headers (frame-ancestors, X-Frame-Options, nosniff, ...) are set in vercel.json -->

		<!-- Title, description, canonical and Open Graph tags: per page via $lib/components/Seo.svelte -->

		<!-- Fonts are self-hosted via @fontsource (imported in src/routes/+layout.svelte) -->

		<!-- Hold the hero intro while the page loads in a background tab, so it isn't over before
		     anyone sees it. Allowed by its sha256 hash in the CSP (vite.config.ts): if you edit
		     this script, update that hash. -->
		<script>if(document.visibilityState==='hidden'){var d=document.documentElement;d.classList.add('intro-hold');document.addEventListener('visibilitychange',function(){d.classList.remove('intro-hold')},{once:true})}</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
