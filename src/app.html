<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		
		<!-- Security Hardening Headers -->
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" />
		<meta http-equiv="X-Content-Type-Options" content="nosniff" />
		<meta http-equiv="X-Frame-Options" content="DENY" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" />

		<!-- Primary Meta -->
		<title>LOT 7 CAFE — Every space starts with a feeling.</title>
		<meta name="description" content="Lot 7 Cafe. Specialty coffee, vinyl listening, and natural light in Naga City, Camarines Sur." />

		<!-- OpenGraph / Social preview for IG bio link -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="LOT 7 CAFE" />
		<meta property="og:description" content="Every space starts with a feeling. Specialty coffee, vinyl listening, and natural light in Naga City, Camarines Sur." />
		<meta property="og:image" content="/images/interior-lounge-wide.png" />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Typography: Assistant, Bebas Neue, Space Grotesk, Newsreader, JetBrains Mono -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
